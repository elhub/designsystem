name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

# Required for OIDC trusted publishing
permissions:
  contents: read
  id-token: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"

      - name: Install Dependencies
        run: |
          printf 'registry=https://registry.npmjs.org/\nlegacy-peer-deps=true\n' > .npmrc
          npm install --no-package-lock && npm install --ws --no-package-lock

      - name: Build
        run: |
          export PATH="$GITHUB_WORKSPACE/node_modules/.bin:$PATH"
          npm run build --ws --if-present

      - name: Publish
        run: |
          npm publish --provenance --access public \
            -w @elhub/ds-tokens \
            -w @elhub/ds-icons \
            -w @elhub/ds-css \
            -w @elhub/ds-components

